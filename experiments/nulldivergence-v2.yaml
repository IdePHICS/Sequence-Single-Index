run:
  d: 1000
  learning_rate_coefficient: 5e-3
  T: 1e6
  teacher_function: 2squaredifference
  student_activation: relu
  ic_type: overlapped
  ic_seed: 3456
  ic_randomsign: false
  learning_rate_scaling_with_L: none
  number_of_measures: 300
  metrics:
      - overlap
      - steps
      - population_square_loss

  # The following parameters will be swept
  L: 2
  data_seed: 0
  student_type: plain_network

hydra:
  sweeper:
    params:
      run.L: 2
      run.data_seed: 0
      run.student_type: tied_network, plain_network

defaults:
 - machine: production
 - override hydra/launcher: joblib